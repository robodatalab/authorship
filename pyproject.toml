[project]
name = "authorship-model"
version = "0.1.0"
description = "Local model server for the Authorship VS Code extension"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "en-core-web-sm",
    "fastapi>=0.115",
    "fastcoref>=2.1.6",
    "pyyaml>=6.0",
    "roost>=0.1.0",
    "spacy>=3.8.14",
    "tenacity>=9.1.4",
    "torch>=2.5",
    "transformers>=4.45",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "parameterized>=0.9",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.69.0.20260720",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
]

