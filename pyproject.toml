[project]
name = "authorship-model"
version = "0.1.0"
description = "Local model server for the Authorship VS Code extension"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0",
    "fastapi>=0.115",
    "pyyaml>=6.0",
    "torch>=2.5",
    "transformers>=4.45",
    "uvicorn>=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
]

