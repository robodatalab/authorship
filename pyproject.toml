[project]
name = "authorship-model"
version = "0.1.0"
description = "Local model server for the Authorship VS Code extension"
requires-python = ">=3.11,<3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "cortexgrid-infer>=0.3.6",
    "spacy>=3.8.14",
    "tenacity>=9.1.4",
    "uvicorn>=0.32",
    "proselint>=0.16.0",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "parameterized>=0.9",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.69.0.20260720",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.11.1",
]

