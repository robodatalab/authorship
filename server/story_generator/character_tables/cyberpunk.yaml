motivation:
  - sold a memory to pay rent and wants to know what it was
  - watched a corporation buy the neighborhood and erase it
  - still pays monthly installments on borrowed lungs
  - once loved someone who uploaded and never came back
  - knows a clone is out there living the life that was stolen
  - wants to feel something real in a world of simulations
  - is the last unaugmented member of a crew and refuses to fall behind
  - was wiped from every database and needs proof of having existed
  - lost a sibling to a designer drug and blames the maker
  - was the face of an ad campaign and cannot escape that smile
  - was once a rising executive and fell in a single afternoon
  - keeps a dead partner's personality on a chip and talks to it nightly
  - dreams of seeing real stars above the smog
  - inherited a mountain of medical debt at the age of nine
  - was raised in a corporate creche and longs for a real family
  - sold out a friend to a fixer and has regretted it ever since
  - wants to own something no one can repossess
  - has six months left before the neural implant degrades
  - was promised a better life by a recruiter and got a contract instead
  - remembers a sky that was blue and wants it back
traits:
  temperament:
    - cool and unreadable
    - twitchy and wired
    - charming and mercenary
    - idealistic and furious
    - cynical with a buried soft streak
    - hyper-focused and terse
    - reckless and grinning
    - polite to the point of menace
    - lonely and overly talkative
    - detached and clinical
    - playful and irreverent
    - cold-eyed and vigilant
    - smooth-talking and restless
    - quietly obsessive
    - moody and theatrical
  quirk:
    - narrates life in the third person
    - taps the data jack behind one ear when thinking
    - changes eye color to match the mood
    - eats only real food, never printed
    - collects paper books in a city that has forgotten them
    - speaks in fragments of old movie dialogue
    - constantly runs diagnostics on a cybernetic arm
    - sleeps only in a bathtub ringed with signal jammers
    - tips every street vendor absurdly well
    - refuses to look at advertising, eyes always down
    - keeps a pet cockroach in a jar
    - gives every AI a pet name
    - switches between four languages mid-sentence
    - counts the exits of every room out loud
    - laughs at the wrong moments, a glitch from a bad implant
  flaw:
    - addicted to recorded memories of other people's lives
    - sells out anyone for the right price
    - cannot resist hacking anything locked
    - trusts machines more than people
    - chases upgrades past the point of sanity
    - lies so often the truth has gone blurry
    - burns bridges for the thrill of it
    - obsessively protective of a street reputation
    - hooked on combat stims
    - treats people like code to be debugged
    - never forgets a slight and never forgives a debt
    - spends every cred the moment it lands
