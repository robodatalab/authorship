motivation:
  - lost the homestead to a land grab and wants it back
  - promised a dying partner to see the gold delivered
  - wants to be remembered as more than a name on a wanted poster
  - ran away from an eastern finishing school and refuses to go back
  - drifted for twenty years and is tired of sleeping alone
  - buried a whole family after the fever and has nothing left to lose
  - was the only one to walk out of a massacre alive
  - wants a piece of land with a fence and a name on it
  - once froze in a gunfight and a friend died for it
  - carries a letter from a stranger promising a new life out west
  - was raised on a family feud and is sick of the killing
  - is the child of the town drunk and means to prove everyone wrong
  - struck it rich once and lost it all overnight
  - is haunted by the face of the first person ever killed
  - longs for the ocean after a childhood on the coast
  - lives by an old code nobody else remembers
  - took the blame for a sibling's crime and spent years in prison
  - sees the railroad coming and wants to get rich before it arrives
  - was cheated out of a mine claim by a smooth-talking banker
  - was nursed back from death by strangers and swore to repay the kindness
traits:
  temperament:
    - laconic and steady
    - hotheaded and loud
    - folksy and sly
    - gruff with a hidden tender streak
    - prim and unshakable
    - easygoing and slow to anger
    - haughty and refined
    - cheerful and talkative
    - weary and fatalistic
    - hard-eyed and unforgiving
    - mischievous and boastful
    - devout and stern
    - watchful and patient as a hawk
    - wild and joyful
    - courteous and cold
  quirk:
    - chews on a matchstick
    - walks a silver dollar across the knuckles
    - quotes Shakespeare to the cattle
    - rolls cigarettes but never smokes them
    - greets every horse by name
    - spits tobacco with deadly accuracy
    - keeps a ledger of every poker hand ever played
    - whittles little birds when thinking
    - tips a hat to every grave along the trail
    - sings hymns off-key while riding
    - talks to a dead partner by the campfire
    - tastes the soil before buying any land
    - never takes off the gloves, even to eat
    - cannot tell a story without exaggerating
    - sleeps with a pistol tucked under the saddle
  flaw:
    - cannot walk away from a poker game
    - drinks whiskey before breakfast
    - too proud to back down from a challenge
    - suspicious of every newcomer to town
    - greedy for gold beyond all sense
    - vengeful to the point of self-destruction
    - lies about the past to anyone who asks
    - falls for every sad story
    - reckless with other people's money
    - cowardly when it counts most
    - bullies anyone weaker
    - falls in love too fast and too hard
