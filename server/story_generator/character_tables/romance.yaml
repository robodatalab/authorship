motivation:
  - grew up on the parents' fairy-tale marriage and refuses to settle for less
  - left at the altar once and still waiting to feel chosen
  - believes in soulmates despite every evidence to the contrary
  - widowed young and promised the late spouse to live fully again
  - has never been anyone's first choice
  - wants to prove a broken heart can mend stronger
  - raised on old love letters found in an attic trunk
  - terrified of ending up as bitter as a divorced parent
  - still carries a ring meant for someone who never said yes
  - gave up a great love for a career and regrets it daily
  - craves the thrill of being pursued
  - needs to feel needed after years of being an afterthought
  - stands to lose an inheritance unless married within the year
  - secretly writes romance novels and wonders if any of it is real
  - lost a first love to a rival and never stopped keeping score
  - wants a home full of noise after a silent childhood
  - ashamed of a past affair and longing to be forgiven
  - believes one grand gesture can fix anything
  - cannot remember the last time anyone said I love you and meant it
  - sees every wedding as a reminder of the clock ticking
traits:
  temperament:
    - tender-hearted and easily wounded
    - flirtatious and teasing
    - aloof until trust is earned
    - hopelessly sentimental
    - proud and prickly
    - dreamy and distracted
    - fiercely devoted
    - charming and evasive
    - steady and patient
    - passionate and quick to flare
    - cynical about love but soft underneath
    - playful and mischievous
    - reserved and old-fashioned
    - bubbly and impulsive
    - quietly intense
  quirk:
    - writes letters by hand and never sends them
    - blushes at the slightest compliment
    - presses flowers between the pages of books
    - reads the last page of a novel first
    - hums old love songs while cooking
    - keeps every ticket stub from every date
    - bakes elaborately when heartbroken
    - fidgets with a signet ring when flustered
    - quotes Shakespeare to deflect feelings
    - makes up nicknames for everyone within minutes
    - dances alone in the kitchen at midnight
    - talks aloud to a late grandmother's photograph
    - overdresses for every occasion
    - answers serious questions with song lyrics
    - remembers everyone's coffee order
  flaw:
    - falls in love with the idea of people, not the people
    - pushes away anyone who gets close
    - too proud to apologize first
    - mistakes jealousy for devotion
    - keeps an ex on speed dial
    - reads rejection into every silence
    - cannot stay single for more than a month
    - tests every partner with manufactured crises
    - promises forever and means it only for the moment
    - measures self-worth by being desired
    - clings to the past and compares everyone to it
    - lies about the past to seem more interesting
