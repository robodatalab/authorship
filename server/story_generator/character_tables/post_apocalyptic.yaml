motivation:
  - was born after the collapse and longs to know what was lost
  - left a younger sibling behind at the evacuation and never went back
  - promised a dying friend to reach the coast
  - once traded a stranger's life for a canteen of water
  - has outlived every companion and dreads being the last one left
  - keeps hearing a familiar voice on an old radio frequency
  - was cast out of the settlement for a crime never committed
  - suspects the radiation sickness has already begun
  - remembers the taste of real fruit and would kill to taste it again
  - watched the bunker doors close from the wrong side
  - wants the children of the camp to grow up without fear
  - was raised by raiders and is trying to unlearn it
  - owes a life to a stranger who never gave a name
  - believes a rumor of a green valley untouched by the fallout
  - lost a whole family to a single bad winter
  - was once the most feared warlord in the wastes and wants to forget
  - wants a place to call home after years on the road
  - collects the names of the dead so someone will remember them
  - helped build the weapon that ended the world
  - craves the respect the scavenger clans never offered
traits:
  temperament:
    - flinty and silent
    - jittery and hyper-alert
    - sunny despite everything
    - coldly practical
    - feral and unpredictable
    - gentle with animals, hard with people
    - paranoid and meticulous
    - boisterous and fearless
    - hollow-eyed and numb
    - stubbornly hopeful
    - cagey and sharp-tongued
    - slow to trust and fierce in loyalty
    - deadpan and unflappable
    - manic and inventive
    - brooding and protective
  quirk:
    - talks to a gas mask as if it were a friend
    - names every weapon ever carried
    - counts bullets compulsively
    - hoards bottle caps and buttons
    - sings pre-war jingles from memory
    - sleeps sitting up with boots on
    - sniffs the wind before every step outside
    - checks a Geiger counter even indoors
    - eats in total silence, guarding the plate
    - tells a different story about every scar
    - ties knots in a string to mark days survived
    - refuses to step on cracks in old asphalt
    - salutes every faded billboard along the road
    - whistles birdcalls to signal companions
    - keeps a dead stranger's wristwatch wound and ticking
  flaw:
    - hoards supplies even when others are starving
    - trusts no one, not even friends
    - drinks irradiated moonshine to dull the nightmares
    - too quick to pull a trigger
    - cannot leave the wounded behind, even when it gets people killed
    - takes reckless risks just to feel alive
    - steals by habit, even from allies
    - clings to the rules of a dead world
    - blames others for every loss
    - addicted to scavenged painkillers
    - sees every stranger as a threat
    - freezes when the shooting starts
