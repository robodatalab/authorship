motivation:
  - promised a dying mother to restore the family's lost estate
  - survived the plague that took the whole village and needs it to mean something
  - was promised in marriage as a child and longs to choose for once
  - carries a forged letter of nobility and lives in dread of discovery
  - watched a beloved sibling hang for a crime someone else committed
  - was taught to read in secret and hungers for a life beyond the fields
  - swore an oath before the altar and cannot bear to be forsworn
  - gambled away the family lands in one night and must win them back
  - was born the bastard of a lord and craves the name withheld at birth
  - was told by a fortune teller of an early death
  - came home from the wars to find no one waiting
  - was raised on tales of a heroic grandfather and fears being ordinary
  - betrayed a friend to the Inquisition long ago and seeks to atone
  - spent seven years as a galley slave and treasures every free breath
  - inherited a debt to the moneylenders that grows with every season
  - believes God spoke once in a dream and is still waiting for the second word
  - was shamed before the whole court and has never stopped replaying it
  - envies a rival who was given every advantage by birth
  - buried three children and clings fiercely to whatever life remains
  - was spared by an enemy soldier and has never understood why
