motivation:
  - watched the family business go bankrupt and swore never to feel helpless again
  - turned forty without a single achievement worth mentioning at a reunion
  - promised a dying grandparent to make the family name mean something again
  - still haunted by the one person who got away a decade ago
  - tired of being the reliable one nobody ever thinks to thank
  - blames a moment of cowardice for a friend's death and seeks redemption
  - grew up invisible among loud siblings and craves being seen
  - just survived a health scare and refuses to waste another day
  - owes a loan shark more than a year's wages
  - wants a younger sibling to have the chances that poverty stole
  - was publicly humiliated online and needs to rewrite the story
  - feels like a fraud and keeps chasing proof of being good enough
  - lost a marriage to overwork and wonders what it was all for
  - recently learned of being adopted and desperate to find the birth family
  - bored to the bone by a safe, comfortable life
  - carries a parent's abandoned dream and feels obliged to finish it
  - once betrayed by a best friend and determined never to trust blindly again
  - needs money for a sibling's surgery before the insurance runs out
  - newly sober and hunting for something worth staying clean for
  - wants to finally be the one who leaves instead of the one left behind
