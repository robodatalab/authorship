traits:
  temperament:
    - observant and reserved
    - charming and evasive
    - prim and exacting
    - gossipy and warm
    - pompous and easily flustered
    - cool and unreadable
    - nosy and good-natured
    - impatient and brilliant
    - mild-mannered and meticulous
    - theatrical and vain
    - wry and perceptive
    - anxious and eager to please
    - genial on the surface, calculating beneath
    - blunt and plain-spoken
    - absent-minded and kind
  quirk:
    - jots everything in a tiny leather notebook
    - polishes spectacles when thinking
    - quotes poetry at inappropriate moments
    - never forgets a face but always forgets names
    - does the crossword in ink every morning
    - taps a pencil whenever telling a lie
    - takes tea at precisely four o'clock
    - straightens crooked pictures in other people's homes
    - eavesdrops without the slightest shame
    - carries a magnifying glass and uses it on everything
    - lapses into French when upset
    - collects samples of other people's handwriting
    - always arrives exactly five minutes early
    - chews on a pipe that is never lit
    - bets on everything, even the weather
  flaw:
    - cannot keep a secret for long
    - leaps to conclusions and defends them stubbornly
    - snobbish about anyone without the right schooling
    - lies smoothly and often
    - spends far beyond any means
    - too proud to admit a mistake
    - meddles where unwelcome
    - covets other people's success
    - turns to blackmail when cornered
    - trusts charm over evidence
    - cannot resist reading other people's letters
    - gossips cruelly behind every back
