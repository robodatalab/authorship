motivation:
  - promised a dying mentor to see the last great task through
  - was born under an omen the whole village still whispers about
  - lost a twin to the red fever and now lives for two
  - carries a family oath sworn three generations ago and never kept
  - was cast out of the home village and means to prove everyone wrong
  - was promised greatness by a seer and dreads dying ordinary
  - grew up on tales of heroes and aches to live inside one
  - bears a curse due to take hold at the next blood moon
  - was the youngest of seven and never once chosen first
  - owes a life to a stranger who vanished without giving a name
  - remembers a golden childhood in a kingdom that no longer exists
  - has heard the gods fall silent and demands an answer
  - was spared by a monster and needs to know why
  - is the last speaker of a dying tongue and feels its weight
  - was sold as a child and has never owned anything since
  - dreams every night of a door that must be opened
  - was left at a temple door and never learned the reason
  - once failed to save a village and still hears its bells
  - has outlived three companions and refuses to bury another
  - longs for a hearth that does not move with the seasons
traits:
  temperament:
    - solemn and soft-spoken
    - boisterous and generous
    - proud and prickly
    - cheerful in the face of doom
    - patient as a mountain
    - restless and wide-eyed
    - stern but fair
    - dreamy and distractible
    - fierce and loyal
    - haughty and sharp-tongued
    - gentle and slow to anger
    - brooding and secretive
    - reckless and laughing
    - devout and earnest
    - sly and charming
  quirk:
    - talks to animals as if to old friends
    - hums old battle hymns when nervous
    - carves tiny wooden birds and leaves them behind
    - swears by gods nobody else has heard of
    - counts the stars aloud before sleeping
    - keeps a tooth from every beast ever slain
    - sprinkles salt across every threshold before sleeping
    - speaks in old proverbs that rarely fit the moment
    - bites every coin to test it, even gifts
    - keeps a tally of every lie ever heard
    - whistles to the wind before setting out on any road
    - refuses to speak the names of the dead
    - sniffs every meal suspiciously before the first bite
    - answers questions with riddles when bored
    - names every weapon and talks to it
  flaw:
    - never forgives a slight, however small
    - cannot resist a wager
    - trusts any stranger with a sad story
    - makes oaths too quickly and breaks them too easily
    - believes prophecy over plain evidence
    - hoards gold while companions go hungry
    - tells tall tales of courage never shown
    - picks fights with anyone of higher rank
    - freezes when lives hang on a quick choice
    - craves glory more than the safety of friends
    - too proud to ask for help, even when dying
    - bitterly jealous of anyone more gifted with magic
background:
  upbringing:
    - grew up in a mountain monastery among silent monks
    - raised among nomadic horse clans of the steppe
    - grew up in the shadow of a crumbling castle
    - spent childhood on a smuggler's ship between island kingdoms
    - grew up in a forest village that paid tribute to the fae
    - raised in the gutters of a sprawling capital
    - grew up at a lonely lighthouse on the edge of the known sea
    - raised as a hostage-ward in a rival lord's court
    - grew up in a mining town deep under the hills
    - raised in a wizard's tower among the servants
    - grew up on a border farm where raiders came every harvest
    - raised by a travelling troupe of players and fire-eaters
  family:
    - orphaned by plague and raised by the village priest
    - the bastard child of a powerful duke
    - raised by a grandparent who taught the old ways
    - the eldest of nine with a sickly mother
    - the only child of a disgraced knight
    - fostered by elves and never quite belonged
    - one of twins, the one the prophecy did not name
    - heir to a house that lost everything in a civil war
    - raised by a stern blacksmith parent after the other walked out
    - the child of a witch burned by the villagers
    - a foundling raised by temple sisters
    - the youngest of a large, loud and loving clan
