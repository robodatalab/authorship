  turning point:
    - framed for the murder of a prince and running from the crown
    - marked by a dragon that will return to claim its due
    - holds a stolen relic every temple in the land wants back
    - the only survivor of an expedition beyond the northern wall
    - bound by a fae bargain that comes due at midwinter
    - exiled with a price on the family name and nowhere left to go
    - drew a sword nobody else could lift and is hunted for it
    - woke in a crypt with no memory and a crown on the brow
    - heir to a throne by a technicality no one wants to honour
    - caught stealing from a wizard and working off the debt in service
    - carries a sealed letter that will start a war if opened
    - the last knight of a betrayed order, hunted by former comrades
looks:
  build:
    - broad-shouldered and barrel-chested
    - small and quick
    - long-limbed and gangly
    - stocky and strong as an ox
    - lean as a hunting hound
    - heavyset yet light on the feet
    - tall and willowy
    - compact and muscular
    - gaunt and bony
    - towering and slow-moving
  features:
    - one eye milky-white from an old curse
    - silver hair despite a young face
    - a serpent tattoo coiled around one wrist
    - pointed ears kept hidden under a hood
    - a missing finger on the sword hand
    - freckles and a nose broken twice
    - mismatched eyes, one green and one gold
    - a jagged scar from brow to jaw
    - long braids threaded with tiny bones
    - skin weathered dark by years of wind
    - a ring of runes tattooed around the neck
    - a chipped front tooth and a gap-toothed grin
    - ink-stained fingers that never come clean
    - a birthmark shaped like a crescent moon
  style:
    - wears patched chainmail over a faded tabard
    - dresses in once-fine velvet gone threadbare
    - carries a staff carved with forgotten runes
    - wears furs and bone charms like a northern raider
    - walks with the straight back of a soldier
    - jingles with charms, bells and amulets
    - wears the signet ring of a house that no longer exists
    - moves barefoot and silent over any ground
    - dresses in court silks wherever the road leads
    - never removes a battered helm, even to eat
    - keeps a hood up and the face half-hidden
    - strides like royalty in rags
