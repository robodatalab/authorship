traits:
  temperament:
    - jumpy and hyper-alert
    - morbidly cheerful
    - cold and clinical
    - quietly devout
    - skeptical to a fault
    - nervous and chatty
    - withdrawn and haunted
    - stubbornly rational
    - tender and easily frightened
    - sardonic and world-weary
    - eerily calm
    - superstitious and anxious
    - brash and thrill-seeking
    - melancholy and poetic
    - prickly and suspicious
  quirk:
    - sleeps with every light in the house on
    - counts the steps on every staircase
    - keeps a rosary in every pocket
    - laughs at the wrong moments
    - talks to the dead as if they might answer
    - checks the locks three times before bed
    - sketches faces seen in dreams
    - never looks into a mirror after dark
    - collects photographs of strangers from junk shops
    - hums lullabies under the breath
    - records every strange sound on an old cassette recorder
    - leaves food out for something never seen
    - flinches at the faintest sound of scratching
    - knows the story of every death in town
    - keeps a jar of baby teeth on the nightstand
  flaw:
    - refuses to believe without proof, even when it is too late
    - opens doors that should stay shut
    - drinks to keep the nightmares away
    - lies compulsively, even about small things
    - abandons others when afraid
    - too curious to leave a mystery alone
    - pushes away anyone who gets close
    - takes reckless dares to prove courage
    - clings to the past and refuses to move on
    - trusts anyone with a kind face
    - secretly enjoys the fear of others
    - cannot say no to someone in tears
