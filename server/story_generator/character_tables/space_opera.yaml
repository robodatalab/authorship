motivation:
  - lost a home world to orbital bombardment and wants it to mean something
  - owes a life debt to an alien who once saved the whole crew
  - a clone of a war hero, desperate to be more than a copy
  - promised a dying captain to bring the ship home
  - born on a generation ship and aching to stand under an open sky
  - carries the last blood of a deposed royal line
  - betrayed by the Fleet and wants the admiralty to answer for it
  - has outlived three crews and fears being the last one standing
  - woke from decades of cryosleep to find everyone loved long gone
  - wants to see the edge of the charted galaxy before dying
  - haunted by obeying an order that burned a colony
  - sold into indenture as a child and never stopped counting the days
  - lost a twin to a wormhole accident and still hears the voice
  - hopes to buy back the family's repossessed ship
  - carries a stolen data chip that could end a war
  - raised on war propaganda and only now seeing the lies
  - hears the call of a faith nobody else remembers
  - wants to outshine a decorated admiral parent
  - exiled for a crime that never happened
  - dreams of founding a free colony with no masters
traits:
  temperament:
    - stoic and disciplined
    - reckless and grinning
    - cold and clinical
    - fiery and honor-bound
    - serene and unreadable
    - jittery and brilliant
    - world-weary and wry
    - swaggering and boastful
    - paranoid and meticulous
    - idealistic to the point of danger
    - regal and imperious
    - cheerful in the face of doom
    - haunted and taciturn
    - curious about everything
    - ruthlessly pragmatic
  quirk:
    - talks to the ship's computer like an old friend
    - taps the hull twice for luck before every launch
    - collects a soil sample from every planet visited
    - swears in a dead alien language
    - never takes off a pair of magnetic boots
    - hums old fleet anthems while working
    - keeps a six-legged alien pet in a jacket pocket
    - insists on cabin gravity set slightly too heavy
    - eats only ration bars, by choice
    - tells the time by the positions of distant stars
    - sleeps in the cockpit instead of quarters
    - bets on everything, even firefights
    - recites the names of lost crewmates before every jump
    - speaks with a thick asteroid-belt drawl
    - rewires anything left unattended
  flaw:
    - trusts machines more than people
    - addicted to combat stims
    - cannot resist a bad wager
    - follows orders past the point of conscience
    - sees every alien as a threat
    - hoards secrets as leverage
    - would sell out a crewmate for the right price
    - too proud to call for help
    - obsessed with revenge above everything else
    - reckless with other people's lives
    - believes in prophecy over evidence
    - cannot let go of a dead empire's glory
