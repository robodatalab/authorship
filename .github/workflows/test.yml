name: Tests

# Runs on every pull request targeting main, so nothing merges without the
# suite passing.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Not `uv sync`: that pulls torch and transformers for a suite that never
      # loads a model. The modules under test reach no further than PyYAML.
      - run: pip install 'pyyaml>=6.0'

      - run: python -m unittest discover -v -s . -p 'test_*.py'
