name: Tests

# Runs on every pull request targeting main, so nothing merges without the
# suite passing.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the full dependency set from the lockfile. uv provisions a
      # Python matching `requires-python`, so no separate setup-python step.
      - run: uv sync

      # Discovery starts in `tests`, but the top-level directory stays the repo
      # root so `server` resolves as a package from the test modules.
      - run: uv run python -m unittest discover -v -s tests -t . -p 'test_*.py'
